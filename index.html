<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theatre Isolation Email</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    select, input, button {
      font-size: 16px;
      padding: 8px;
      margin-top: 10px;
      width: 80%;
    }
  </style>
</head>
<body>
  <h2>Theatre Isolation Email</h2>
  
  <label for="reason">Reason:</label><br>
  <select id="reason">
    <option value="External Hire">External Hire</option>
    <option value="Concert">Concert</option>
    <option value="Work">Work</option>
  </select><br><br>

  <label for="finishTime">Finish Time:</label><br>
  <input type="time" id="finishTime"><br><br>

  <button onclick="generateEmail()">Send Email</button>

<script>
  function generateEmail() {
    const reason = document.getElementById("reason").value;
    const finishTime = document.getElementById("finishTime").value;
    if (!finishTime) {
      alert("Please select a finish time.");
      return;
    }

    // Round current time to nearest 5 minutes (handles :60 roll-over)
    const now = new Date();
    let mins = Math.round(now.getMinutes() / 5) * 5;
    let hrs = now.getHours();
    if (mins === 60) { hrs = (hrs + 1) % 24; mins = 0; }
    const formattedTime = `${String(hrs).padStart(2,'0')}${String(mins).padStart(2,'0')}`;

    const recipients = [
      "lomulderd@marash.qld.edu.au",
      "jansonsb@marash.qld.edu.au"
    ]; // use commas for mailto

    const subject = "Theatre Isolated";
    const body = `Theatre isolated from ${formattedTime} until ${finishTime.replace(":","")} for ${reason}`;

    const mailtoLink =
      `mailto:${recipients.join(",")}` +
      `?subject=${encodeURIComponent(subject)}` +
      `&body=${encodeURIComponent(body)}`;

    window.location.href = mailtoLink;
  }
</script>

</body>
</html>
